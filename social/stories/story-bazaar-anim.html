<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: #fff;
    color: #1f2937;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .deco-gear {
    position: absolute;
    top: -90px; right: -90px;
    width: 460px; height: 460px;
    fill: #f3f4f6;
    z-index: 0;
    animation: spin 36s linear infinite paused;
  }
  .deco-gear2 {
    position: absolute;
    bottom: 60px; left: -120px;
    width: 320px; height: 320px;
    fill: #f9fafb;
    z-index: 0;
    animation: spinrev 48s linear infinite paused;
  }
  .content {
    flex: 1;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 170px 64px 26px 64px;
  }
  .pill {
    background: #f97316;
    color: #fff;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 5px;
    padding: 18px 42px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  h1 { font-size: 92px; font-weight: 800; line-height: 1.04; margin-top: 30px; color: #111827; }
  .sub { font-size: 44px; font-weight: 700; color: #1a73e8; margin-top: 14px; }
  .time { font-size: 52px; font-weight: 800; color: #f97316; margin-top: 28px; }
  .time .free { color: #1a73e8; }
  .loc { font-size: 39px; font-weight: 600; line-height: 1.4; margin-top: 12px; color: #1f2937; }
  .vband {
    width: 100%;
    margin-top: 26px;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 22px 55px rgba(17,24,39,.28);
    background: #111827;
    position: relative;
  }
  .vband video { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .vtag {
    position: absolute;
    top: 20px; left: 20px;
    background: rgba(17,24,39,.78);
    color: #fff;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 10px 24px;
    border-radius: 999px;
  }
  .cards { display: flex; gap: 32px; width: 100%; margin-top: 28px; }
  .card {
    flex: 1;
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 28px;
    padding: 22px 20px 26px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
  }
  .card .imgbox { height: 178px; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .bob-bike, .card .bob-bud { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .card img.cover { width: 100%; height: 100%; object-fit: cover; }
  .card .name { font-size: 38px; font-weight: 800; color: #111827; margin-top: 16px; }
  .card .price { font-size: 52px; font-weight: 800; color: #f97316; margin-top: 6px; }
  .takehome {
    align-self: center;
    margin-top: 24px;
    background: #fff7ed;
    border: 3px solid #fb923c;
    border-radius: 999px;
    padding: 18px 44px;
    font-size: 42px;
    font-weight: 800;
    color: #c2410c;
  }
  footer {
    position: relative; z-index: 1;
    background: #1f2937;
    height: 120px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 64px; gap: 22px;
  }
  footer svg { width: 60px; height: 60px; fill: #fff; }
  footer span { color: #fff; font-size: 40px; font-weight: 700; }

  .anim { animation-play-state: paused; }
  body.running .anim { animation-play-state: running; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(28px); }  to { opacity: 1; transform: none; } }
  @keyframes pop      { from { opacity: 0; transform: scale(.82); }        to { opacity: 1; transform: scale(1); } }
  @keyframes slideL   { from { opacity: 0; transform: translateX(-64px); } to { opacity: 1; transform: none; } }
  @keyframes slideR   { from { opacity: 0; transform: translateX(64px); }  to { opacity: 1; transform: none; } }
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes spinrev  { to { transform: rotate(-360deg); } }
  @keyframes bob      { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

  .a-pill   { animation: fadeDown .7s ease-out .2s both; }
  .a-h1     { animation: fadeUp .8s ease-out .55s both; }
  .a-sub    { animation: fadeUp .8s ease-out .95s both; }
  .a-time   { animation: fadeUp .8s ease-out 1.3s both; }
  .a-loc    { animation: fadeUp .8s ease-out 1.6s both; }
  .a-vid    { animation: fadeUp .9s ease-out 2s both; }
  .a-cardL  { animation: slideL .8s ease-out 3.4s both; }
  .a-cardR  { animation: slideR .8s ease-out 3.7s both; }
  .a-take   { animation: pop .7s cubic-bezier(.34,1.56,.64,1) 4.8s both; }
  .a-foot   { animation: fadeUp .8s ease-out .3s both; }
  .bob-bike { animation: bob 2.8s ease-in-out 3.4s infinite; }
  .bob-bud  { animation: bob 3.4s ease-in-out 3.7s infinite; }
</style>
</head>

  <div class="content">
    <div class="pill anim a-pill">Saturday &middot; Oct 10, 2026</div>
    <h1 class="anim a-h1">Family Bazaar</h1>
    <div class="sub anim a-sub">Kids' STEM &amp; Robotics Workshops</div>
    <div class="time anim a-time">11:30 AM &ndash; 4:15 PM &middot; <span class="free">Free entry</span></div>
    <div class="loc anim a-loc">Pineview Community Hub &mdash; Gloucester &amp; Meadowbrook Room<br>1700 Blair Rd, Gloucester, ON</div>
    <div class="vband anim a-vid">
      <video src="videos/bike-loop.mp4" autoplay muted loop playsinline preload="auto" aria-label="Blix Minis Bike demo video"></video>
      <div class="vtag">&#9654; Watch it roll</div>
    </div>
    <div class="cards">
      <div class="card anim a-cardL">
        <div class="imgbox"><div class="bob-bike anim">
          <img src="../../images/Blix_Minis_Bike.png" alt="Blix Minis Bike kit">
        </div></div>
        <div class="name">Mini Bike</div>
        <div class="price">$12</div>
      </div>
      <div class="card anim a-cardR">
        <div class="imgbox"><div class="bob-bud anim">
          <img class="cover" src="../../images/blix_buddy.jpg" alt="Blix Buddy kit">
        </div></div>
        <div class="name">Buddy</div>
        <div class="price">$28</div>
      </div>
    </div>
    <div class="takehome anim a-take">Take the kits home with you!</div>
  </div>
  <footer class="anim a-foot">

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- gear teeth (cardinal) -->
  <g fill="#1a73e8">
    <rect x="27" y="4" width="10" height="12" rx="2"/>
    <rect x="27" y="48" width="10" height="12" rx="2"/>
    <rect x="4" y="27" width="12" height="10" rx="2"/>
    <rect x="48" y="27" width="12" height="10" rx="2"/>
  </g>
  <!-- gear teeth (diagonal) -->
  <g fill="#1a73e8">
    <g transform="rotate(45 32 32)">
      <rect x="27" y="4" width="10" height="12" rx="2"/>
      <rect x="27" y="48" width="10" height="12" rx="2"/>
      <rect x="4" y="27" width="12" height="10" rx="2"/>
      <rect x="48" y="27" width="12" height="10" rx="2"/>
    </g>
  </g>
  <!-- gear body -->
  <circle cx="32" cy="32" r="16" fill="#1a73e8"/>
  <circle cx="32" cy="32" r="7" fill="#ffffff"/>
  <!-- brick -->
  <rect x="15" y="6" width="34" height="14" rx="3.5" fill="#ff6d00"/>
  <circle cx="22" cy="6" r="3.5" fill="#ff6d00"/>
  <circle cx="32" cy="6" r="3.5" fill="#ff6d00"/>
  <circle cx="42" cy="6" r="3.5" fill="#ff6d00"/>
</svg>

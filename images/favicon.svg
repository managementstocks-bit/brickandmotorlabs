<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- gear teeth (8) -->
  <g fill="#1a73e8">
    <g>
      <rect x="27" y="6" width="10" height="10" rx="3"/>
      <rect x="27" y="48" width="10" height="10" rx="3"/>
      <rect x="6" y="27" width="10" height="10" rx="3"/>
      <rect x="48" y="27" width="10" height="10" rx="3"/>
    </g>
    <g transform="rotate(45 32 32)">
      <rect x="27" y="6" width="10" height="10" rx="3"/>
      <rect x="27" y="48" width="10" height="10" rx="3"/>
      <rect x="6" y="27" width="10" height="10" rx="3"/>
      <rect x="48" y="27" width="10" height="10" rx="3"/>
    </g>
  </g>
  <!-- gear body -->
  <circle cx="32" cy="32" r="19" fill="#1a73e8"/>
  <!-- hub -->
  <circle cx="32" cy="32" r="12" fill="#ffffff"/>
  <!-- brick -->
  <g fill="#ff6d00">
    <rect x="24" y="30" width="16" height="9" rx="2.5"/>
    <circle cx="28" cy="28.8" r="2.2"/>
    <circle cx="32" cy="28.8" r="2.2"/>
    <circle cx="36" cy="28.8" r="2.2"/>
  </g>
</svg>
